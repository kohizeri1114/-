<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ろるぱーくカスタム管理アプリ</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e3e6ee;--bl:#2563eb;--rd:#dc2626;--ac:#7c3aed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1219;--card:#181c27;--tx:#e8eaf0;--mu:#9aa3b2;--bd:#2a3042;--bl:#60a5fa;--rd:#f87171;--ac:#a78bfa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.b{background:var(--bl);border-color:var(--bl);color:#fff}
button.r{background:var(--rd);border-color:var(--rd);color:#fff}
input,select{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:8px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1;min-width:140px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:999px;padding:3px 6px 3px 12px;margin:4px 6px 0 0;background:var(--bg)}
.chip select{padding:2px 4px;font-size:12px}
.chip .x{border:0;background:none;padding:2px 6px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.teams{grid-template-columns:1fr}}
.team{border-radius:12px;padding:12px;border:2px solid}
.team.bl{border-color:var(--bl)}.team.rd{border-color:var(--rd)}
.team h3{margin:0 0 8px;font-size:16px}.bl h3{color:var(--bl)}.rd h3{color:var(--rd)}
.slot{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center;margin-bottom:8px}
.role{font-size:12px;font-weight:700;color:var(--mu)}
.slot .in{display:flex;gap:4px;flex-wrap:wrap;grid-column:2}
.slot .in input{width:100%}
.slot .in input.n{width:54px;padding:6px}
.tw{overflow-x:auto}
.ann{overflow:hidden;white-space:nowrap;background:var(--ac);color:#fff;font-size:14px;padding:6px 0}
.annt{display:inline-block;padding-left:100%;animation:annm var(--d,20s) linear infinite}
.ann:hover .annt{animation-play-state:paused}
@keyframes annm{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.annt{animation:none;padding-left:12px}}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
details.mt{border-bottom:1px solid var(--bd);padding:6px 0}details.mt summary{cursor:pointer}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
</style></head><body><div id="ann" class="ann" hidden><div id="annt" class="annt"></div></div><div class="w">
<h1>ろるぱーくカスタム管理アプリ</h1>
<div class="row" style="margin-bottom:12px"><b>団体</b><select id="gs"></select></div>
<div class="tabs"><button id="t1" class="on">チーム分け</button><button id="t2">戦績</button><button id="t3">履歴</button><button id="t4">設定</button></div>

<div id="p1">
  <div class="card">
    <div class="row"><input id="nm" type="text" list="names" placeholder="名前を入力（Enterで追加）" maxlength="20"><button class="pri" id="add">追加</button></div>
    <div id="pl"></div>
    <div class="mu" id="cnt"></div>
  </div>
  <div class="card">
    <div class="row">
      <label><input type="radio" name="m" value="free" checked> ロール指定なし</label>
      <label><input type="radio" name="m" value="role"> ロール指定あり</label>
      <button class="pri" id="go">このメンバーでチーム分け</button>
    </div>
    <div class="mu">選択した希望ロール・希望サイドが優先されます。11人以上のときは10人をランダムに選び観戦者を抽選します。「優先出場」にチェックした人は優先的に出場します。</div>
  </div>
  <div id="res"></div>
</div>

<div id="p2" hidden>
  <div class="card"><div class="tw" id="st"></div></div>
  <div class="card" id="dt" hidden></div>
</div>
<div id="p3" hidden>
  <div class="card"><div class="row"><select id="fp"></select><input id="fc" type="text" list="champs" placeholder="チャンピオン" style="max-width:150px"><input id="ff" type="date"><span class="mu">〜</span><input id="ft" type="date"><select id="fm"><option value="">ロール有無</option><option value="role">ロールあり</option><option value="free">ロールなし</option></select><button id="fx">クリア</button></div><div class="mu" id="fn" style="margin-top:6px"></div></div>
  <div class="card"><div class="mu" id="mm">開いて、チャンピオン・KDAの修正、勝敗の変更、削除ができます。</div><div id="mh" style="margin-top:8px"></div></div>
</div>
<div id="p4" hidden>
  <div class="card"><b>団体の管理</b><div class="row" style="margin-top:8px"><input id="gn" type="text" placeholder="団体名（例: LTK）" maxlength="20"><button id="ga">追加</button><button id="gr">名前変更</button><button id="gd">削除</button></div><div class="mu" id="gm" style="margin-top:6px">団体ごとに参加者・戦績が別管理されます。切り替えは画面上部の「団体」で行います。</div></div>
  <div class="card"><b>メンバー名の変更</b><div class="row" style="margin-top:8px"><select id="ro"></select><span class="mu">→</span><input id="rv" type="text" placeholder="新しい名前" maxlength="20"><button id="rn">変更</button></div><div class="mu" id="rm" style="margin-top:6px">過去の戦績の名前もまとめて変わります。すでにある名前にすると統合されます。</div></div>
  <div class="card"><div class="row"><button id="ex">JSONを書き出し</button><label class="mu">読み込み: <input id="im" type="file" accept=".json,application/json"></label></div>
  <details id="io" style="margin-top:8px"><summary class="mu">テキストでコピー／貼り付け</summary><textarea id="ta" rows="6" style="width:100%;margin-top:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px"></textarea><div class="row" style="margin-top:6px"><button id="sh">現在のデータを表示</button><button id="ld">貼り付けた内容を読み込む</button></div></details>
  <div class="mu" id="msg" style="margin-top:6px">読み込みは既存データに追加されます（同じ試合は重複しません）</div></div>
</div>
</div>
<datalist id="champs"></datalist><datalist id="names"></datalist>
<script>
// ▼ 上部に流れるアナウンス。ここを書き換えて使う（複数OK、空 [] にすると非表示）
const ANNOUNCE=[
  "ろるぱーくカスタム管理アプリ ver1.1.0",
  "試合後はチャンピオンとKDAを入力して、勝敗を保存しよう",
  "欲しい機能があったらつよしにDMしてね",
  "【実績】『逆ドラゴンスレイヤー』...どな",
];
// 流れる速さの調整：数字が大きいほどゆっくり（1文字あたりの秒数）
const ANNOUNCE_SPEED=0.35;
const R=["TOP","JG","MID","ADC","SUP"];
const K="lolsplit_v1";
let DB={groups:[],cur:""},S;
let cur=null;
try{const x=localStorage.getItem(K);if(x){const d=JSON.parse(x);DB=d.groups?d:{groups:[{id:"g1",name:"デフォルト",players:d.players||[],history:d.history||[]}],cur:"g1"};}}catch(e){}
if(!DB.groups.length)DB={groups:[{id:"g1",name:"デフォルト",players:[],history:[]}],cur:"g1"};
const setG=id=>{S=DB.groups.find(g=>g.id===id)||DB.groups[0];DB.cur=S.id;if(!S.players)S.players=[];if(!S.history)S.history=[];};
setG(DB.cur);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mode=()=>document.querySelector('input[name=m]:checked').value;

function tab(n){for(let i=1;i<=4;i++){$("p"+i).hidden=i!=n;$("t"+i).className=i==n?"on":"";}if(n>1)stats();}
[1,2,3,4].forEach(i=>$("t"+i).onclick=()=>tab(i));

function addP(){
  const v=$("nm").value.trim();if(!v)return;
  if(S.players.some(p=>p.name===v)){$("nm").select();return;}
  S.players.push({name:v,pref:"",side:""});$("nm").value="";save();pl();
}
$("add").onclick=addP;
$("nm").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){setTimeout(addP,0);}});
function pl(){dl();
  $("pl").innerHTML=S.players.map((p,i)=>`<span class="chip">${esc(p.name)}<select data-i="${i}" data-k="pref"><option value="">ロール希望なし</option>${R.map(r=>`<option${p.pref===r?" selected":""}>${r}</option>`).join("")}</select><select data-i="${i}" data-k="side"><option value="">サイド希望なし</option><option value="blue"${p.side==="blue"?" selected":""}>ブルー</option><option value="red"${p.side==="red"?" selected":""}>レッド</option><option value="spec"${p.side==="spec"?" selected":""}>観戦</option></select><label class="mu" style="font-size:12px"><input type="checkbox" data-i="${i}" data-k="prio"${p.prio?" checked":""}>優先出場</label><button class="x" data-d="${i}">✕</button></span>`).join("");
  $("cnt").textContent=`${S.players.length}人`+(()=>{const w=S.players.filter(p=>p.side==="spec").length,a=S.players.length-w,s=w+Math.max(0,a-10);return s?`（出場${S.players.length-s}人、観戦${s}人）`:"";})();
}
$("pl").addEventListener("change",e=>{if(e.target.dataset.k){S.players[e.target.dataset.i][e.target.dataset.k]=e.target.type==="checkbox"?e.target.checked:e.target.value;save();}});
$("pl").addEventListener("click",e=>{if(e.target.dataset.d!=null){S.players.splice(e.target.dataset.d,1);save();pl();}});

const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function assign(team,useRole){
  if(!useRole)return team.map(p=>({name:p.name,role:""}));
  const left=R.slice(),out=[],rest=[];
  team.forEach(p=>{if(p.pref&&left.includes(p.pref)){out.push({name:p.name,role:p.pref});left.splice(left.indexOf(p.pref),1);}else rest.push(p);});
  rest.forEach(p=>{const r=left.splice(Math.floor(Math.random()*left.length),1)[0];out.push({name:p.name,role:r});});
  return out.sort((a,b)=>R.indexOf(a.role)-R.indexOf(b.role));
}
$("go").onclick=()=>{
  const sw=S.players.filter(p=>p.side==="spec"),pool=S.players.filter(p=>p.side!=="spec");
  if(pool.length<2){$("res").innerHTML='<div class="card">観戦希望を除いて2人以上必要です。</div>';return;}
  const pr=shuf(pool.filter(p=>p.prio)),ot=shuf(pool.filter(p=>!p.prio)),order=pr.concat(ot),ps=order.slice(0,10),spec=order.slice(10).concat(shuf(sw)),n=ps.length,h=Math.ceil(n/2),ur=mode()==="role";
  const bs=n%2&&Math.random()<.5?n-h:h,rs=n-bs;
  let B=ps.filter(p=>p.side==="blue"),Rd=ps.filter(p=>p.side==="red"),rest=ps.filter(p=>p.side!=="blue"&&p.side!=="red");
  rest=rest.concat(B.splice(bs),Rd.splice(rs));
  shuf(rest);
  while(B.length<bs)B.push(rest.pop());
  while(Rd.length<rs)Rd.push(rest.pop());
  cur={mode:ur?"role":"free",blue:assign(B,ur),red:assign(Rd,ur),spec:spec.map(p=>p.name)};
  show();
};
function slot(side,t){
  return t.map((p,i)=>`<div class="slot"><div class="role">${p.role||"　"}</div><div><b>${esc(p.name)}</b></div>
  <div class="in"><input data-s="${side}" data-i="${i}" data-f="champ" placeholder="チャンピオン" list="champs" style="flex:1;min-width:100px">
  <input class="n" data-s="${side}" data-i="${i}" data-f="k" type="number" min="0" placeholder="K">
  <input class="n" data-s="${side}" data-i="${i}" data-f="d" type="number" min="0" placeholder="D">
  <input class="n" data-s="${side}" data-i="${i}" data-f="a" type="number" min="0" placeholder="A"></div></div>`).join("");
}
function show(){
  $("res").innerHTML=`<div class="teams"><div class="team bl"><h3>ブルーサイド</h3>${slot("blue",cur.blue)}</div><div class="team rd"><h3>レッドサイド</h3>${slot("red",cur.red)}</div></div>
  ${cur.spec&&cur.spec.length?`<div class="card" style="margin-top:14px"><b>観戦</b>：${cur.spec.map(esc).join("、")}</div>`:""}<div class="card" style="margin-top:14px"><div class="mu">試合後にチャンピオン・KDAを入力して勝敗を保存すると戦績に反映されます（入力は任意）。</div>
  <div class="row" style="margin-top:8px"><button class="b" data-w="blue">ブルー勝利で保存</button><button class="r" data-w="red">レッド勝利で保存</button></div></div>`;
}
$("res").addEventListener("click",e=>{
  const w=e.target.dataset.w;if(!w||!cur)return;
  const m={id:Date.now(),date:new Date().toISOString().slice(0,10),mode:cur.mode,winner:w,blue:cur.blue.map(x=>({...x})),red:cur.red.map(x=>({...x}))};
  document.querySelectorAll("#res input[data-s]").forEach(el=>{
    const p=m[el.dataset.s][el.dataset.i],f=el.dataset.f,v=el.value.trim();
    if(f==="champ")p.champ=v;else p[f]=v===""?null:Number(v);
  });
  S.history.push(m);save();cur=null;gl();dl();
  $("res").innerHTML='<div class="card">保存しました。「戦績」タブで確認できます。</div>';
});

function agg(){
  const A={};
  S.history.forEach(m=>["blue","red"].forEach(side=>m[side].forEach(p=>{
    const a=A[p.name]||(A[p.name]={g:0,w:0,k:0,d:0,a:0,kg:0,ch:{},ro:{},res:[]});
    a.g++;const win=m.winner===side;if(win)a.w++;a.res.push(win);
    if(p.k!=null&&p.d!=null&&p.a!=null){a.k+=p.k;a.d+=p.d;a.a+=p.a;a.kg++;}
    if(p.champ){const c=a.ch[p.champ]||(a.ch[p.champ]={g:0,w:0});c.g++;if(win)c.w++;}
    if(p.role){const r=a.ro[p.role]||(a.ro[p.role]={g:0,w:0});r.g++;if(win)r.w++;}
  })));
  return A;
}
let openId=null,delArm=null;
function stk(r){let run=0,last=null,bw=0,bl=0;r.forEach(x=>{if(x===last)run++;else{run=1;last=x;}if(x)bw=Math.max(bw,run);else bl=Math.max(bl,run);});return{cur:r.length?(last?run:-run):0,bw,bl};}
function stkT(r){const c=stk(r).cur;return c>=2?`<span style="color:var(--bl)">${c}連勝</span>`:c<=-2?`<span style="color:var(--rd)">${-c}連敗</span>`:"-";}
function pairs(n){const al={},en={};S.history.forEach(m=>{const sd0=m.blue.some(p=>p.name===n)?"blue":m.red.some(p=>p.name===n)?"red":null;if(!sd0)return;const win=m.winner===sd0;["blue","red"].forEach(sd=>m[sd].forEach(p=>{if(p.name===n)return;const o=sd===sd0?al:en,c=o[p.name]||(o[p.name]={g:0,w:0});c.g++;if(win)c.w++;}));});return{al,en};}
function fillP(){const set=new Set();S.history.forEach(m=>[...m.blue,...m.red].forEach(p=>set.add(p.name)));const c=$("fp").value;$("fp").innerHTML='<option value="">全員</option>'+[...set].map(n=>`<option${n===c?" selected":""}>${esc(n)}</option>`).join("");}
function fillRo(){const set=new Set(S.players.map(p=>p.name));S.history.forEach(m=>[...m.blue,...m.red].forEach(p=>set.add(p.name)));const c=$("ro").value;$("ro").innerHTML='<option value="">変更する人</option>'+[...set].map(n=>`<option${n===c?" selected":""}>${esc(n)}</option>`).join("");}
function pass(m,F){const ps=[...m.blue,...m.red];return(!F.f||m.date>=F.f)&&(!F.t||m.date<=F.t)&&(!F.m||m.mode===F.m)&&(!F.p&&!F.c||ps.some(x=>(!F.p||x.name===F.p)&&(!F.c||(x.champ||"").includes(F.c))));}
function mh(){
  const side=(t,sd)=>t.map((p,i)=>`<div class="slot"><div class="role">${p.role||"　"}</div><div><b>${esc(p.name)}</b></div><div class="in"><input data-f="champ" data-s="${sd}" data-i="${i}" placeholder="チャンピオン" value="${esc(p.champ||"")}" style="flex:1;min-width:100px">${["k","d","a"].map(f=>`<input class="n" data-f="${f}" data-s="${sd}" data-i="${i}" type="number" min="0" placeholder="${f.toUpperCase()}" value="${p[f]==null?"":p[f]}">`).join("")}</div></div>`).join("");
  fillP();const F={p:$("fp").value,c:$("fc").value.trim(),f:$("ff").value,t:$("ft").value,m:$("fm").value},L=S.history.filter(m=>pass(m,F)).reverse();$("fn").textContent=L.length+" / "+S.history.length+"試合";
  $("mh").innerHTML=L.length?L.map(m=>`<details class="mt" data-id="${m.id}"${m.id===openId?" open":""}><summary>${esc(m.date)}　<b style="color:var(--${m.winner==="blue"?"bl":"rd"})">${m.winner==="blue"?"ブルー":"レッド"}勝利</b>　<span class="mu">${m.mode==="role"?"ロールあり":"ロールなし"}</span></summary><div class="teams" style="margin:8px 0"><div class="team bl"><h3>ブルー</h3>${side(m.blue,"blue")}</div><div class="team rd"><h3>レッド</h3>${side(m.red,"red")}</div></div><div class="row" style="margin-bottom:6px"><button class="pri" data-a="save">変更を保存</button><button data-a="flip">勝敗を逆にする</button><button class="r" data-a="del">削除</button></div></details>`).join(""):'<div class="mu">まだ記録がありません。</div>';
}
const pct=(w,g)=>g?Math.round(w/g*100)+"%":"-";
function stats(){gl();mh();dl();fillRo();
  const A=agg(),names=Object.keys(A).sort((a,b)=>A[b].g-A[a].g);
  $("dt").hidden=true;
  $("st").innerHTML=names.length?`<table><tr><th>名前</th><th>試合</th><th>勝</th><th>勝率</th><th>平均KDA</th><th>連続</th></tr>${names.map(n=>{const a=A[n];return `<tr class="cl" data-n="${esc(n)}"><td>${esc(n)}</td><td>${a.g}</td><td>${a.w}</td><td>${pct(a.w,a.g)}</td><td>${a.kg?(a.d?((a.k+a.a)/a.d).toFixed(2):"Perfect"):"-"}</td><td>${stkT(a.res)}</td></tr>`}).join("")}</table><div class="mu" style="margin-top:6px">行をタップで詳細</div>`:'<div class="mu">まだ記録がありません。</div>';
}
$("st").addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-n]");if(!tr)return;
  const n=tr.dataset.n,a=agg()[n],sk=stk(a.res),P=pairs(n),tb=o=>Object.keys(o).length?`<div class="tw"><table><tr><th>相手</th><th>試合</th><th>勝率</th></tr>${rows(o)}</table></div>`:'<div class="mu">記録なし</div>';
  const rows=o=>Object.entries(o).sort((x,y)=>y[1].g-x[1].g).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.g}</td><td>${pct(v.w,v.g)}</td></tr>`).join("");
  $("dt").hidden=false;
  $("dt").innerHTML=`<h3 style="margin:0 0 8px">${esc(n)}</h3><div class="mu">合計 K${a.k} / D${a.d} / A${a.a}（入力があった${a.kg}試合）</div><div class="mu">最大 ${sk.bw}連勝 / ${sk.bl}連敗</div>
  <h4>ピックチャンピオン</h4>${Object.keys(a.ch).length?`<div class="tw"><table><tr><th>チャンプ</th><th>試合</th><th>勝率</th></tr>${rows(a.ch)}</table></div>`:'<div class="mu">記録なし</div>'}
  <h4>味方のときの勝率</h4>${tb(P.al)}<h4>敵のときの勝率</h4>${tb(P.en)}
  <h4>ロール別</h4>${Object.keys(a.ro).length?`<div class="tw"><table><tr><th>ロール</th><th>試合</th><th>勝率</th></tr>${rows(a.ro)}</table></div>`:'<div class="mu">記録なし</div>'}`;
});
function data(){return JSON.stringify({app:"lol-team-splitter",v:2,group:S.name,players:S.players,history:S.history},null,1);}
function merge(txt){
  let d;try{d=JSON.parse(txt)}catch(e){return "JSONとして読み込めませんでした。";}
  if(!d||!Array.isArray(d.history))return "形式が違います。";
  const ids=new Set(S.history.map(m=>m.id));let n=0;
  d.history.forEach(m=>{if(m&&m.id&&!ids.has(m.id)){S.history.push(m);ids.add(m.id);n++;}});
  S.history.sort((a,b)=>a.id-b.id);
  (d.players||[]).forEach(p=>{if(p&&p.name&&!S.players.some(q=>q.name===p.name))S.players.push({name:String(p.name),pref:p.pref||"",side:p.side||"",prio:!!p.prio});});
  save();pl();gl();stats();return "「"+S.name+"」に"+n+"試合を追加しました。";
}
$("ex").onclick=()=>{
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data()],{type:"application/json"}));a.download="lol-"+S.name+".json";a.click();}catch(e){}
  $("ta").value=data();$("io").open=true;$("msg").textContent="ダウンロードされない環境では、下のテキストをコピーして data.json として保存してください。";
};
$("im").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("msg").textContent=merge(r.result);};r.readAsText(f);e.target.value="";};
$("ld").onclick=()=>{$("msg").textContent=merge($("ta").value);};
$("sh").onclick=()=>{$("ta").value=data();};
function gl(){$("gs").innerHTML=DB.groups.map(g=>`<option value="${g.id}"${g.id===DB.cur?" selected":""}>${esc(g.name)}（${g.history.length}試合）</option>`).join("");}
function refresh(){cur=null;$("res").innerHTML="";pl();gl();stats();}
$("gs").onchange=e=>{setG(e.target.value);save();refresh();$("gm").textContent="「"+S.name+"」に切り替えました。";};
$("ga").onclick=()=>{
  const v=$("gn").value.trim();
  if(!v){$("gm").textContent="団体名を入力してください。";return;}
  if(DB.groups.some(g=>g.name===v)){$("gm").textContent="同じ名前の団体があります。";return;}
  const id="g"+Date.now();DB.groups.push({id,name:v,players:[],history:[]});setG(id);save();$("gn").value="";refresh();$("gm").textContent="「"+v+"」を作成して切り替えました。";
};
$("gr").onclick=()=>{
  const v=$("gn").value.trim();
  if(!v){$("gm").textContent="新しい名前を入力してから押してください。";return;}
  if(DB.groups.some(g=>g.name===v)){$("gm").textContent="同じ名前の団体があります。";return;}
  S.name=v;save();$("gn").value="";gl();$("gm").textContent="名前を変更しました。";
};
let gdArm=false;
$("gd").onclick=()=>{
  if(DB.groups.length<2){$("gm").textContent="最後の1団体は削除できません。";return;}
  if(!gdArm){gdArm=true;$("gd").textContent="本当に削除";$("gm").textContent="「"+S.name+"」の参加者と戦績が消えます。もう一度押すと削除します。";setTimeout(()=>{gdArm=false;$("gd").textContent="削除";},4000);return;}
  gdArm=false;$("gd").textContent="削除";DB.groups=DB.groups.filter(g=>g!==S);setG(DB.groups[0].id);save();refresh();$("gm").textContent="削除しました。";
};
$("mh").addEventListener("click",e=>{
  const a=e.target.dataset.a;if(!a)return;
  const d=e.target.closest("details"),id=Number(d.dataset.id),m=S.history.find(x=>x.id===id);if(!m)return;
  if(a==="del"){
    if(delArm!==id){delArm=id;e.target.textContent="本当に削除";$("mm").textContent="この試合の記録が消えます。もう一度「本当に削除」を押すと削除します。";return;}
    S.history=S.history.filter(x=>x.id!==id);save();openId=null;delArm=null;stats();$("mm").textContent="削除しました。";return;
  }
  if(a==="save"){
    d.querySelectorAll("input[data-f]").forEach(el=>{const p=m[el.dataset.s][el.dataset.i],f=el.dataset.f,v=el.value.trim();if(f==="champ")p.champ=v;else p[f]=v===""?null:Number(v);});
    save();openId=id;delArm=null;stats();$("mm").textContent="変更を保存しました。";return;
  }
  if(a==="flip"){m.winner=m.winner==="blue"?"red":"blue";save();openId=id;delArm=null;stats();$("mm").textContent="勝敗を変更しました。";}
});
function dl(){
  const ch={},nm={};
  const add=(o,v)=>{if(v)o[v]=(o[v]||0)+1;};
  DB.groups.forEach(g=>g.history.forEach(m=>["blue","red"].forEach(sd=>m[sd].forEach(p=>add(ch,p.champ)))));
  S.history.forEach(m=>["blue","red"].forEach(sd=>m[sd].forEach(p=>add(nm,p.name))));
  S.players.forEach(p=>delete nm[p.name]);
  const o=a=>Object.keys(a).sort((x,y)=>a[y]-a[x]||x.localeCompare(y,"ja")).map(v=>`<option value="${esc(v)}">`).join("");
  $("champs").innerHTML=o(ch);$("names").innerHTML=o(nm);
}
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(!(t&&t.dataset&&t.dataset.f)||e.isComposing||e.keyCode===229)return;
  const sc=t.closest("details")||$("res"),L=[...sc.querySelectorAll("input[data-f]")],i=L.indexOf(t),k=e.key,num=t.type==="number";
  let j;
  if(k==="Enter")j=i+1;
  else if(k==="ArrowRight"&&(num||(t.selectionStart===t.value.length&&t.selectionEnd===t.value.length)))j=i+1;
  else if(k==="ArrowLeft"&&(num||(t.selectionStart===0&&t.selectionEnd===0)))j=i-1;
  else if(k==="ArrowDown"&&num)j=i+4;
  else if(k==="ArrowUp"&&num)j=i-4;
  else return;
  if(k!=="Enter")e.preventDefault();
  setTimeout(()=>{const n=L[j];if(n){n.focus();n.select();}},0);
});
["fp","fc","ff","ft","fm"].forEach(i=>$(i).addEventListener("input",mh));
$("fx").onclick=()=>{["fp","fc","ff","ft","fm"].forEach(i=>$(i).value="");mh();};
$("rn").onclick=()=>{
  const o=$("ro").value,n=$("rv").value.trim(),r=$("rm");
  if(!o||!n){r.textContent="変更する人と新しい名前を入力してください。";return;}
  if(o===n){r.textContent="同じ名前です。";return;}
  if(S.history.some(m=>{const x=[...m.blue,...m.red].map(p=>p.name);return x.includes(o)&&x.includes(n);})){r.textContent="同じ試合に両方の名前があるため統合できません。";return;}
  const merged=S.players.some(p=>p.name===n)||S.history.some(m=>[...m.blue,...m.red].some(p=>p.name===n));
  S.history.forEach(m=>[...m.blue,...m.red].forEach(p=>{if(p.name===o)p.name=n;}));
  const po=S.players.find(p=>p.name===o);
  if(po){if(S.players.some(p=>p.name===n))S.players=S.players.filter(p=>p!==po);else po.name=n;}
  save();pl();stats();$("rv").value="";r.textContent="「"+o+"」を「"+n+"」に"+(merged?"統合":"変更")+"しました。";
};
(()=>{const t=ANNOUNCE.filter(Boolean).join("　　　◆　　　");if(!t)return;$("annt").textContent=t;$("annt").style.setProperty("--d",Math.max(15,t.length*ANNOUNCE_SPEED)+"s");$("ann").hidden=false;})();
pl();gl();
</script></body></html>
